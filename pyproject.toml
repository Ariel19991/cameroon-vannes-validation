[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cameroon-vannes-validation"
version = "1.0.0"
description = "Reproducible correction and validation of Vannes' point-by-point terrain-correction method"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Ariel Bounou Guimking"},
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "openpyxl>=3.1",
  "Pillow>=10.0",
  "matplotlib>=3.8",
  "pandas>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
# GitHub's web uploader does not preserve Unix executable bits. The scripts
# retain portable shebangs and remain runnable with ``python scripts/...``.
"scripts/*.py" = ["EXE001"]
